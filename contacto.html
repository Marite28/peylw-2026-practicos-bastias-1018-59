<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Portal Personal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <header>
    <div class="titulo-cabecera">
      <h1>Mi Portal Personal</h1>
      <img class="logo-curza" src="img/logo-curza.png" alt="Logo del CURZA">
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="acercade.html">Acerca de</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Horarios de atención</h2>
    <div class="contenedor-tabla">
      <table>
        <thead>
          <tr><th>Día</th><th>Horario</th><th>Modalidad</th></tr>
        </thead>
        <tbody>
          <tr><td>Lunes</td><td>18:00 a 20:00</td><td>Virtual</td></tr>
          <tr><td>Miércoles</td><td>16:00 a 18:00</td><td>Presencial</td></tr>
          <tr><td>Viernes</td><td>10:00 a 12:00</td><td>Virtual</td></tr>
          <tr><td>Sábado</td><td>09:00 a 11:00</td><td>Presencial</td></tr>
        </tbody>
      </table>
    </div>

    <h2>Escribime</h2>
    <form action="#" method="post">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="email">Correo</label>
      <input type="email" id="email" name="email" required>

      <label for="asunto">Asunto</label>
      <select id="asunto" name="asunto">
        <option>Consulta</option>
        <option>Colaboración</option>
        <option>Otro</option>
      </select>

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5"></textarea>

      <button type="submit">Enviar mensaje</button>
    </form>
  </main>

  <footer>&copy; 2026 - Marité Bastías- CURZA</footer>

  <a href="#top" class="volver-arriba" aria-label="Volver al inicio">&#9650;</a>
</body>
</html>
